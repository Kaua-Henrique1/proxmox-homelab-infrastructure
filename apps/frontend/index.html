<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Homelab Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-8 text-blue-400">⚡ Homelab Control Center</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-xl font-bold mb-2">📦 MinIO S3</h2>
        <a href="http://192.168.0.2:9001" target="_blank" class="block text-center bg-blue-600 hover:bg-blue-500 py-2 rounded-lg font-medium transition">Abrir Console</a>
      </div>
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-xl font-bold mb-2">🖥️ Proxmox VE</h2>
        <a href="https://192.168.0.2:8006" target="_blank" class="block text-center bg-orange-600 hover:bg-orange-500 py-2 rounded-lg font-medium transition">Abrir Proxmox</a>
      </div>
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-xl font-bold mb-2">🎮 Xbox Automação</h2>
        <button onclick="runXboxScript()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg font-medium transition">Executar Script</button>
        <div id="output" class="mt-3 text-xs text-slate-400 break-words"></div>
      </div>
    </div>
  </div>
  <script>
    async function runXboxScript() {
      const output = document.getElementById('output');
      output.innerText = "Executando...";
      try {
        const response = await fetch('http://' + window.location.hostname + ':3001/api/xbox/run', { method: 'POST' });
        const data = await response.json();
        output.innerText = data.success ? "Sucesso: " + data.output : "Erro: " + data.error;
      } catch (err) {
        output.innerText = "Erro ao conectar na API.";
      }
    }
  </script>
</body>
</html>
