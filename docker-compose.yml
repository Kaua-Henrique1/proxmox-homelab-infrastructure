services:
  # --- INFRAESTRUTURA DE ARMAZENAMENTO ---
  redis:
    image: redis:alpine
    container_name: juicefs-redis
    ports:
      - "${REDIS_PORT}:6379"
    restart: always

  minio:
    image: minio/minio:latest
    container_name: juicefs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - ${MINIO_STORAGE_PATH}:/data
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    restart: always

  no1:
    build: ./infra/juicefs-node
    container_name: cluster-no1
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    depends_on:
      - redis
      - minio
    command: >
      sh -c "
        sleep 5;
        juicefs format --storage s3 --bucket http://minio:9000/juicefs-bucket --access-key ${MINIO_USER} --secret-key ${MINIO_PASSWORD} redis://redis:6379/1 meu-cluster || true;
        juicefs mount redis://redis:6379/1 /mnt/compartilhado;
        tail -f /dev/null
      "

  no2:
    build: ./infra/juicefs-node
    container_name: cluster-no2
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    depends_on:
      - no1
    command: >
      sh -c "
        sleep 8;
        juicefs mount redis://redis:6379/1 /mnt/compartilhado;
        tail -f /dev/null
      "

  no3:
    build: ./infra/juicefs-node
    container_name: cluster-no3
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    depends_on:
      - no1
    command: >
      sh -c "
        sleep 8;
        juicefs mount redis://redis:6379/1 /mnt/compartilhado;
        tail -f /dev/null
      "

  # --- PAINEL DE CONTROLE (DASHBOARD) ---
  dashboard-backend:
    build: ./apps/backend
    container_name: homelab-backend
    ports:
      - "${API_PORT}:3001"
    environment:
      - XBOX_IP=${XBOX_IP}
      - XBOX_USER=${XBOX_USER}
      - XBOX_PASS=${XBOX_PASS}
    volumes:
      - ./scripts:/scripts
      - ${XBOX_JOGOS_PATH}:/xboxjogos
    restart: always

  dashboard-frontend:
    build: ./apps/frontend
    container_name: homelab-frontend
    ports:
      - "${DASHBOARD_PORT}:80"
    depends_on:
      - dashboard-backend
    restart: always